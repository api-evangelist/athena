aid: athena
name: Athena
description: Athena is an executive assistant service that pairs entrepreneurs, founders,
  and executives with dedicated, full-time remote executive assistants, along with the
  recruiting, training, and delegation coaching needed to work with them effectively.
  Athena screens a large global applicant pool and accepts only a small fraction, then
  equips its assistants with proprietary in-house AI tooling to maximize productivity
  across email, scheduling, research, travel, and day-to-day operations. The company is
  headquartered in San Juan, Puerto Rico and is backed by investors including Khosla
  Ventures. Athena is a services company with no public developer API surface at this time.
